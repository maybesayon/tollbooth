[alembic]
script_location = tollbooth:migrations
file_template = %%(rev)s_%%(slug)s
# The URL comes from TOLLBOOTH_DATABASE_URL via tollbooth.db.alembic_config(); this is a fallback
# for running the alembic CLI directly.
sqlalchemy.url = sqlite+aiosqlite:///./data/tollbooth.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
